<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Kierowcy - Pomoc Drogowa</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #fff; text-align: center; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 440px; margin: 20px auto; box-shadow: 0 8px 20px rgba(0,0,0,0.4); text-align: left; }
    h2, p { text-align: center; }
    label { font-size: 12px; color: #94a3b8; display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 12px; margin-top: 4px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 16px; }
    button.success { background: #22c55e; color: #000; }
    button.stop { background: #ef4444; color: #fff; }
    .toggle-link { color: #38bdf8; font-size: 13px; margin-top: 14px; cursor: pointer; display: block; text-align: center; text-decoration: underline; }
    .hidden { display: none; }
    .status-badge { padding: 8px; border-radius: 6px; font-size: 13px; text-align: center; margin-top: 10px; background: #16a34a; color: #fff; font-weight: bold; }
    .coords { font-family: monospace; color: #38bdf8; margin-top: 10px; text-align: center; }
    .vehicle-select-box { background: #0f172a; border: 1px solid #38bdf8; padding: 14px; border-radius: 8px; margin: 15px 0; }
  </style>
</head>
<body>

  <!-- EKRAN LOGOWANIA -->
  <div class="card" id="loginBox">
    <h2>🔐 Logowanie Kierowcy</h2>
    <p style="color: #94a3b8; font-size: 13px;">Wprowadź dane dostępowe</p>
    
    <form onsubmit="handleLogin(event)">
      <label for="loginPhone">Numer telefonu:</label>
      <input type="tel" id="loginPhone" name="username" autocomplete="username" placeholder="np. 500100200" required />
      
      <label for="loginPass">Hasło:</label>
      <input type="password" id="loginPass" name="password" autocomplete="current-password" placeholder="Wpisz hasło" required />

      <button type="submit">Zaloguj się</button>
    </form>

    <span class="toggle-link" onclick="switchView('registerBox')">Pierwszy raz? Zarejestruj się i zweryfikuj uprawnienia</span>
    <div id="loginMsg" style="color: #ef4444; font-size: 13px; margin-top: 10px; text-align: center;"></div>
  </div>

  <!-- EKRAN REJESTRACJI I WERYFIKACJI -->
  <div class="card hidden" id="registerBox">
    <h2>🪪 Rejestracja Kierowcy</h2>
    <p style="color: #94a3b8; font-size: 13px;">Weryfikacja danych personalnych i uprawnień</p>
    
    <form onsubmit="handleRegister(event)">
      <label for="regName">Imię i Nazwisko:</label>
      <input type="text" id="regName" placeholder="np. Jan Kowalski" required />

      <label for="regPhone">Numer telefonu (Login):</label>
      <input type="tel" id="regPhone" name="username" autocomplete="username" placeholder="np. 500100200" required />

      <label for="regId">Seria i nr Dowodu Osobistego / PESEL:</label>
      <input type="text" id="regId" placeholder="np. ABC 123456" required />

      <label for="regLicense">Numer Prawa Jazdy (Kat. B+E / C):</label>
      <input type="text" id="regLicense" placeholder="np. 12345/67/8901" required />

      <label for="regPass">Ustal hasło do konta:</label>
      <input type="password" id="regPass" name="new-password" autocomplete="new-password" placeholder="Minimum 6 znaków" required />

      <button type="submit" class="success">Zarejestruj i zweryfikuj</button>
    </form>

    <span class="toggle-link" onclick="switchView('loginBox')">Wróć do logowania</span>
    <div id="regMsg" style="margin-top: 10px; font-size: 13px; text-align: center;"></div>
  </div>

  <!-- EKRAN NADAJNIKA GPS DLA ZALOGOWANEGO KIEROWCY -->
  <div class="card hidden" id="trackerBox">
    <h2>🚗 Nadajnik GPS Lawety</h2>
    <p id="welcomeDriver" style="color: #38bdf8; font-size: 14px; font-weight: bold;"></p>
    
    <div class="status-badge">Kierowca zweryfikowany ✔️</div>

    <div class="vehicle-select-box">
      <label style="color: #38bdf8; font-weight: bold; margin-top: 0;">🚐 Wybierz pojazd na ten kurs:</label>
      <select id="vehicleSelector" onchange="updateVehicleChoice()">
        <option value="Laweta #1 (PO 12345)">Laweta #1 (PO 12345)</option>
        <option value="Laweta #2 (PO 67890)">Laweta #2 (PO 67890)</option>
        <option value="Laweta #3 - Ciężarowa (PO 11223)">Laweta #3 - Ciężarowa (PO 11223)</option>
        <option value="custom">Inny pojazd (wpisz ręcznie)...</option>
      </select>

      <div id="customPlateBox" class="hidden" style="margin-top: 8px;">
        <label>Wpisz numer rejestracyjny / nazwę pojazdu:</label>
        <input type="text" id="customPlateInput" placeholder="np. PO 99881" />
      </div>
    </div>

    <button id="toggleBtn" class="success" onclick="toggleGps()">🟢 Rozpocznij kurs (Włącz GPS)</button>

    <div class="coords" id="coordsText">Lat: -- , Lng: --</div>
    <div id="pingText" style="font-size: 12px; color: #64748b; margin-top: 8px; text-align: center;"></div>

    <button onclick="handleLogout()" style="background: transparent; border: 1px solid #475569; color: #94a3b8; margin-top: 20px;">Wyloguj</button>
  </div>

  <script>
    let activeSession = JSON.parse(localStorage.getItem("active_driver_session") || "null");

    if (activeSession) {
      showTrackerView(activeSession);
    }

    function switchView(viewId) {
      ['loginBox', 'registerBox', 'trackerBox'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
    }

    function updateVehicleChoice() {
      const selector = document.getElementById("vehicleSelector");
      const customBox = document.getElementById("customPlateBox");
      if (selector.value === "custom") {
        customBox.classList.remove("hidden");
      } else {
        customBox.classList.add("hidden");
      }
    }

    function getActiveVehicleName() {
      const selector = document.getElementById("vehicleSelector");
      if (selector.value === "custom") {
        const customVal = document.getElementById("customPlateInput").value.trim();
        return customVal || "Laweta";
      }
      return selector.value;
    }

    function handleRegister(e) {
      e.preventDefault();
      const full_name = document.getElementById("regName").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const id_number = document.getElementById("regId").value.trim();
      const driving_license = document.getElementById("regLicense").value.trim();
      const password = document.getElementById("regPass").value.trim();
      const regMsg = document.getElementById("regMsg");

      const drivers = JSON.parse(localStorage.getItem("registered_drivers") || "[]");

      const existing = drivers.find(d => d.phone === phone);
      if (existing) {
        regMsg.style.color = "#ef4444";
        regMsg.innerText = "Konto z tym numerem już istnieje! Przejdź do logowania.";
        return;
      }

      const newDriver = { full_name, phone, id_number, driving_license, password };
      drivers.push(newDriver);
      localStorage.setItem("registered_drivers", JSON.stringify(drivers));

      regMsg.style.color = "#22c55e";
      regMsg.innerText = "Konto zweryfikowane pomyślnie! Logowanie...";

      setTimeout(() => {
        localStorage.setItem("active_driver_session", JSON.stringify(newDriver));
        showTrackerView(newDriver);
      }, 1000);
    }

    function handleLogin(e) {
      e.preventDefault();
      const phone = document.getElementById("loginPhone").value.trim();
      const password = document.getElementById("loginPass").value.trim();
      const loginMsg = document.getElementById("loginMsg");

      const drivers = JSON.parse(localStorage.getItem("registered_drivers") || "[]");
      const user = drivers.find(d => d.phone === phone && d.password === password);

      if (!user) {
        loginMsg.style.color = "#ef4444";
        loginMsg.innerText = "Niepoprawny numer telefonu lub hasło.";
        return;
      }

      localStorage.setItem("active_driver_session", JSON.stringify(user));
      showTrackerView(user);
    }

    function showTrackerView(user) {
      activeSession = user;
      switchView('trackerBox');
      document.getElementById("welcomeDriver").innerText = `Kierowca: ${user.full_name}`;
    }

    function handleLogout() {
      if (timerId) toggleGps();
      localStorage.removeItem("active_driver_session");
      location.reload();
    }

    // MQTT GPS Transmisja
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    let isConnected = false;
    let timerId = null;
    let currentLat = null;
    let currentLng = null;
    let pingCount = 0;

    client.on('connect', () => { isConnected = true; });

    function broadcastPosition() {
      if (!currentLat || !currentLng || !isConnected || !activeSession) return;

      const vehicleLabel = getActiveVehicleName();

      const payload = JSON.stringify({
        id: "laweta-1",
        name: `${activeSession.full_name} [${vehicleLabel}]`,
        lat: currentLat,
        lng: currentLng,
        active: true,
        time: new Date().toLocaleTimeString()
      });

      client.publish('pomoc-drogowa/gps', payload, { retain: true });
      pingCount++;
      document.getElementById("pingText").innerText = `Wysłano pakietów: ${pingCount} (${new Date().toLocaleTimeString()})`;
    }

    function toggleGps() {
      const btn = document.getElementById("toggleBtn");

      if (!timerId) {
        if (!navigator.geolocation) {
          alert("Brak modułu GPS w urządzeniu.");
          return;
        }

        navigator.geolocation.watchPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            document.getElementById("coordsText").innerText = `Lat: ${currentLat.toFixed(5)}, Lng: ${currentLng.toFixed(5)}`;
            broadcastPosition();
          },
          (err) => console.error(err),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );

        timerId = setInterval(broadcastPosition, 2000);
        btn.innerText = "🔴 Zakończ kurs (Wyłącz GPS)";
        btn.className = "stop";
      } else {
        clearInterval(timerId);
        timerId = null;
        if (isConnected) {
          client.publish('pomoc-drogowa/gps', JSON.stringify({ id: "laweta-1", active: false }), { retain: true });
        }
        btn.innerText = "🟢 Rozpocznij kurs (Włącz GPS)";
        btn.className = "success";
        document.getElementById("pingText").innerText = "";
      }
    }
  </script>
</body>
</html>
