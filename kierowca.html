<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Kierowcy - Pomoc Drogowa</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #fff; text-align: center; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 420px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    input { width: 100%; padding: 12px; margin: 8px 0 16px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; box-sizing: border-box; }
    button { background: #22c55e; color: #000; border: none; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
    button.stop { background: #ef4444; color: #fff; }
    .status { margin-top: 15px; font-size: 15px; color: #94a3b8; }
    .coords { font-family: monospace; color: #38bdf8; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚗 Nadajnik GPS Lawety</h2>
    <p style="color: #94a3b8; font-size: 14px;">Włącz nadawanie, aby pojawić się na mapie u klientów.</p>
    
    <div style="text-align: left;">
      <label style="font-size: 13px; color: #94a3b8;">Nazwa pojazdu:</label>
      <input type="text" id="driverName" value="Jadwiga Matuszak" />
    </div>

    <button id="toggleBtn" onclick="toggleGps()">🟢 Włącz nadawanie GPS</button>

    <div class="status" id="statusText">Status: Wyłączony</div>
    <div class="coords" id="coordsText">Lat: -- , Lng: --</div>
  </div>

  <script>
    const REST_URL = "https://pofvghphcfrdtalyqui.supabase.co/rest/v1/drivers";
    const API_KEY = "sb_publishable_5ftuKj2b17oQkeyqDpsePg_k13hgzhn";

    let watchId = null;
    let driverId = localStorage.getItem("driver_id") || null;

    async function sendToSupabase(url, method, bodyData, extraHeaders = {}) {
      const res = await fetch(url, {
        method: method,
        headers: {
          "apikey": API_KEY,
          "Authorization": `Bearer ${API_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=representation",
          ...extraHeaders
        },
        body: JSON.stringify(bodyData)
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`HTTP ${res.status}: ${errText}`);
      }
      return await res.json();
    }

    async function toggleGps() {
      const btn = document.getElementById("toggleBtn");
      const status = document.getElementById("statusText");
      const driverName = document.getElementById("driverName").value;

      if (!watchId) {
        if (!navigator.geolocation) {
          alert("Brak obsługi GPS w przeglądarce.");
          return;
        }

        status.innerText = "Rejestracja w bazie...";

        try {
          if (!driverId) {
            const data = await sendToSupabase(REST_URL, "POST", {
              name: driverName,
              is_available: true,
              lat: 52.40637,
              lng: 16.92516
            });
            if (data && data.length > 0) {
              driverId = data[0].id;
              localStorage.setItem("driver_id", driverId);
            }
          }

          watchId = navigator.geolocation.watchPosition(
            async (pos) => {
              const { latitude, longitude } = pos.coords;
              document.getElementById("coordsText").innerText = `Lat: ${latitude.toFixed(5)}, Lng: ${longitude.toFixed(5)}`;
              status.innerText = "Status: Transmisja aktywna 📡";

              await sendToSupabase(`${REST_URL}?id=eq.${driverId}`, "PATCH", {
                lat: latitude,
                lng: longitude,
                is_available: true,
                updated_at: new Date().toISOString()
              });
            },
            (err) => {
              status.innerText = "Błąd GPS: " + err.message;
            },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
          );

          btn.innerText = "🔴 Zatrzymaj nadawanie";
          btn.classList.add("stop");
        } catch (err) {
          alert("Błąd połączenia: " + err.message);
          status.innerText = "Błąd bazy: " + err.message;
        }
      } else {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        if (driverId) {
          await sendToSupabase(`${REST_URL}?id=eq.${driverId}`, "PATCH", { is_available: false });
        }
        btn.innerText = "🟢 Włącz nadawanie GPS";
        btn.classList.remove("stop");
        status.innerText = "Status: Zatrzymany";
      }
    }
  </script>
</body>
</html>
