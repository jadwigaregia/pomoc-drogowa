<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Kierowcy - Pomoc Drogowa</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #fff; text-align: center; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 420px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    input { width: 100%; padding: 12px; margin: 8px 0 16px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; box-sizing: border-box; }
    button { background: #22c55e; color: #000; border: none; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
    button.stop { background: #ef4444; color: #fff; }
    .status { margin-top: 15px; font-size: 15px; color: #94a3b8; }
    .coords { font-family: monospace; color: #38bdf8; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚗 Nadajnik GPS Lawety</h2>
    <p style="color: #94a3b8; font-size: 14px;">Włącz nadawanie, aby pojawić się na mapie u klientów.</p>
    
    <div style="text-align: left;">
      <label style="font-size: 13px; color: #94a3b8;">Nazwa pojazdu:</label>
      <input type="text" id="driverName" value="Jadwiga Matuszak (Laweta #1)" />
    </div>

    <button id="toggleBtn" onclick="toggleGps()">🟢 Włącz nadawanie GPS</button>

    <div class="status" id="statusText">Status: Gotowy do połączenia</div>
    <div class="coords" id="coordsText">Lat: -- , Lng: --</div>
  </div>

  <script>
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    let watchId = null;
    let isConnected = false;

    client.on('connect', () => {
      isConnected = true;
      document.getElementById("statusText").innerText = "Połączono z siecią satelitarną ✔️";
    });

    function toggleGps() {
      const btn = document.getElementById("toggleBtn");
      const status = document.getElementById("statusText");
      const driverName = document.getElementById("driverName").value;

      if (!watchId) {
        if (!navigator.geolocation) {
          alert("Brak obsługi GPS w urządzeniu.");
          return;
        }

        status.innerText = "Uruchamianie GPS...";

        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            document.getElementById("coordsText").innerText = `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;
            status.innerText = "Status: Transmisja aktywna na żywo 📡";

            const payload = JSON.stringify({
              id: "laweta-1",
              name: driverName,
              lat: lat,
              lng: lng,
              active: true
            });

            if (isConnected) {
              client.publish('pomoc-drogowa/gps', payload, { retain: true });
            }
          },
          (err) => {
            alert("Błąd GPS: " + err.message);
            status.innerText = "Błąd GPS: " + err.message;
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );

        btn.innerText = "🔴 Zatrzymaj nadawanie";
        btn.classList.add("stop");
      } else {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;

        if (isConnected) {
          client.publish('pomoc-drogowa/gps', JSON.stringify({ id: "laweta-1", active: false }), { retain: true });
        }

        btn.innerText = "🟢 Włącz nadawanie GPS";
        btn.classList.remove("stop");
        status.innerText = "Status: Zatrzymany";
      }
    }
  </script>
</body>
</html>
