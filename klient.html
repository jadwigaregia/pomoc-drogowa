<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gdzie jest pomoc? - Śledzenie na żywo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100vh; }
    .overlay {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: white; padding: 12px 20px; border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="overlay" id="statusBox">🔍 Szukanie dostępnych lawet w pobliżu...</div>
  <div id="map"></div>

  <script>
    const SUPABASE_URL = "https://pofvghphcfrdtalyqui.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5ftuKj2b17oQkeyqDpsePg_kl3bgzhN";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Inicjalizacja darmowej mapy OpenStreetMap
    const map = L.map('map').setView([52.2297, 21.0122], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let markers = {};

    // Pobranie pozycji poszkodowanego
    navigator.geolocation.getCurrentPosition((pos) => {
      const { latitude, longitude } = pos.coords;
      map.setView([latitude, longitude], 13);
      L.marker([latitude, longitude]).addTo(map).bindPopup("📍 Twoja lokalizacja (Miejsce zdarzenia)").openPopup();
    });

    // Pobranie aktualnych pozycji kierowców
    async function fetchDrivers() {
      const { data: drivers } = await supabaseClient.from('drivers').select('*').eq('is_available', true);
      if (drivers && drivers.length > 0) {
        document.getElementById("statusBox").innerText = `🚗 Lawety na mapie: ${drivers.length}`;
        drivers.forEach(updateDriverMarker);
      }
    }

    function updateDriverMarker(driver) {
      if (!driver.lat || !driver.lng) return;

      if (markers[driver.id]) {
        markers[driver.id].setLatLng([driver.lat, driver.lng]);
      } else {
        markers[driver.id] = L.marker([driver.lat, driver.lng]).addTo(map)
          .bindPopup(`<b>${driver.name}</b><br>W drodze / Dostępny`);
      }
    }

    // Nasłuchiwanie zmian na żywo (Realtime)
    supabaseClient
      .channel('public:drivers')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'drivers' }, (payload) => {
        updateDriverMarker(payload.new);
      })
      .subscribe();

    fetchDrivers();
  </script>
</body>
</html>
