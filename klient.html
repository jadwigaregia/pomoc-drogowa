<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <title>Pomoc Drogowa 24/7 - Wezwij i Śledź Lawetę</title>

  <!-- PWA & Mobile Web App -->
  <link rel="manifest" href="manifest-klient.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Wezwij Pomoc" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #0b1120; padding: 14px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 17px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .emergency-call { background: var(--danger); color: white; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; }

    .main-container { padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 14px; flex: 1; }
    .card { background: var(--card-bg); padding: 18px; border-radius: 14px; border: 1px solid #334155; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

    label { font-size: 12px; color: var(--subtext); display: block; margin-top: 10px; margin-bottom: 4px; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: var(--primary); }

    button { border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 12px; }
    .btn-submit { background: var(--primary); color: #0f172a; }
    .btn-install { background: linear-gradient(135deg, #22c55e, #10b981); color: #052e16; font-weight: 800; margin-bottom: 4px; }

    #clientMap { height: 260px; width: 100%; border-radius: 12px; border: 1px solid #334155; z-index: 5; }

    .status-tracker { background: #1e1b4b; border: 1px solid #4f46e5; border-radius: 12px; padding: 14px; text-align: center; }
    .status-badge { display: inline-block; background: #4f46e5; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
    .driver-info-box { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; border-top: 1px solid #312e81; padding-top: 10px; }

    .pulse { animation: pulseAnim 2s infinite; }
    @keyframes pulseAnim { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🚨 POMOC DROGOWA 24H</div>
    <a href="tel:664901126" class="emergency-call">📞 Zadzwoń</a>
  </header>

  <div class="main-container">
    <button id="installAppBtn" class="btn-install hidden" onclick="installPWA()">📲 Zainstaluj aplikację na telefonie</button>

    <!-- FORMULARZ WEZWANIA POMOCY -->
    <div class="card" id="requestFormCard">
      <h2 style="font-size: 17px; margin-bottom: 4px; color: var(--primary);">📍 Wezwij Lawetę / Pomoc Drogową</h2>
      <p style="font-size: 12px; color: var(--subtext);">Wypełnij dane, a natychmiast wyślemy najbliższego kierowcę</p>

      <form onsubmit="handleOrderSubmit(event)">
        <label>Twoje Imię i Nazwisko:</label>
        <input type="text" id="custName" placeholder="np. Piotr Nowak" required />

        <label>Numer telefonu do kontaktu:</label>
        <input type="tel" id="custPhone" placeholder="np. 600 700 800" required />

        <label>Marka i model pojazdu:</label>
        <input type="text" id="custCar" placeholder="np. Audi A4 / BMW Seria 3" required />

        <label>Rodzaj zdarzenia:</label>
        <select id="custIssue">
          <option value="Awaria silnika / elektroniki">Awaria silnika / elektroniki</option>
          <option value="Kolizja / Wypadek drogowy">Kolizja / Wypadek drogowy</option>
          <option value="Przebita opona / Koło">Przebita opona / Koło</option>
          <option value="Brak paliwa / Złe paliwo">Brak paliwa / Złe paliwo</option>
          <option value="Wyciąganie z rowu / błota">Wyciąganie z rowu / błota</option>
        </select>

        <label>Lokalizacja zdarzenia (lub pobierz GPS):</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="custAddress" placeholder="Wpisz adres lub ulicę" style="flex:1;" required />
          <button type="button" onclick="detectLocation()" style="width:auto; margin-top:0; padding:0 14px; background:#334155; color:var(--primary); font-size:13px;">📍 GPS</button>
        </div>

        <button type="submit" class="btn-submit">🚀 Wyślij wezwanie do kierowcy</button>
      </form>
    </div>

    <!-- STATUS I ŚLEDZENIE NA MAPIE -->
    <div class="status-tracker hidden" id="statusTrackerCard">
      <span class="status-badge" id="clientStatusBadge">Oczekiwanie na kierowcę</span>
      <h3 id="etaText" style="font-size: 16px; margin-bottom: 4px;">Laweta w drodze 🚗</h3>
      <p id="lastUpdateText" style="font-size: 12px; color: var(--subtext);">Łączenie z nadajnikiem GPS...</p>

      <div class="driver-info-box">
        <div style="text-align: left;">
          <span style="font-size: 11px; color: var(--subtext);">Kierowca z lawetą:</span>
          <strong id="assignedDriver" style="display:block; font-size:14px; color:var(--primary);">Dyspozytornia</strong>
        </div>
        <a id="driverCallBtn" href="tel:664901126" style="background:#22c55e; color:#052e16; padding:8px 12px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:13px;">
          📞 Zadzwoń
        </a>
      </div>
    </div>

    <!-- MAPA NA ŻYWO DLA KLIENTA -->
    <div class="card" style="padding: 12px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
        <span style="font-size: 13px; font-weight: bold; color: var(--subtext);">🗺️ Pozycja Lawety na Żywo</span>
        <span id="gpsLiveIndicator" style="font-size: 12px; color: #64748b;">● Oczekiwanie na sygnał</span>
      </div>
      <div id="clientMap"></div>
    </div>

  </div>

  <script>
    // PWA Instalacja
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const b = document.getElementById('installAppBtn');
      if (b) b.classList.remove('hidden');
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
      }
    }

    let map = null;
    let driverMarker = null;
    let clientMarker = null;
    let clientLat = 52.40637;
    let clientLng = 16.92516;

    // Inicjalizacja Mapy
    map = L.map('clientMap').setView([clientLat, clientLng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    // Połączenie z brokerem MQTT
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    client.on('connect', () => {
      client.subscribe('pomoc-drogowa/gps');
    });

    client.on('message', (topic, msg) => {
      if (topic === 'pomoc-drogowa/gps') {
        try {
          const data = JSON.parse(msg.toString());
          if (data.active && data.lat && data.lng) {
            updateDriverOnMap(data);
          } else if (data.active === false) {
            document.getElementById('gpsLiveIndicator').innerText = "● Nadajnik wyłączony";
            document.getElementById('gpsLiveIndicator').style.color = "#64748b";
          }
        } catch(e) {}
      }
    });

    function updateDriverOnMap(data) {
      document.getElementById('gpsLiveIndicator').innerText = "● Na żywo (GPS)";
      document.getElementById('gpsLiveIndicator').style.color = "var(--success)";
      
      document.getElementById('assignedDriver').innerText = data.name || "Kierowca";
      document.getElementById('lastUpdateText').innerText = `Ostatnia aktualizacja pozycji: ${data.time}`;
      
      if (data.status) {
        document.getElementById('clientStatusBadge').innerText = data.status;
      }

      if (!driverMarker) {
        const towTruckIcon = L.divIcon({
          html: `<div style="font-size:26px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">🚛</div>`,
          className: 'custom-tow-icon',
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });
        driverMarker = L.marker([data.lat, data.lng], { icon: towTruckIcon }).addTo(map);
      } else {
        driverMarker.setLatLng([data.lat, data.lng]);
      }

      // Automatyczne dopasowanie widoku do obu punktów
      if (clientMarker) {
        const group = L.featureGroup([driverMarker, clientMarker]);
        map.fitBounds(group.getBounds().pad(0.2));
      } else {
        map.setView([data.lat, data.lng], 14);
      }
    }

    function detectLocation() {
      if (!navigator.geolocation) return alert("Brak wsparcia GPS w przeglądarce.");
      
      navigator.geolocation.getCurrentPosition(pos => {
        clientLat = pos.coords.latitude;
        clientLng = pos.coords.longitude;
        document.getElementById('custAddress').value = `GPS: ${clientLat.toFixed(4)}, ${clientLng.toFixed(4)}`;
        
        if (!clientMarker) {
          clientMarker = L.marker([clientLat, clientLng]).addTo(map).bindPopup("📍 Twoja lokalizacja").openPopup();
        } else {
          clientMarker.setLatLng([clientLat, clientLng]);
        }
        map.setView([clientLat, clientLng], 15);
      });
    }

    function handleOrderSubmit(e) {
      e.preventDefault();
      const client_name = document.getElementById('custName').value.trim();
      const client_phone = document.getElementById('custPhone').value.trim();
      const car_model = document.getElementById('custCar').value.trim();
      const issue = document.getElementById('custIssue').value;
      const address = document.getElementById('custAddress').value.trim();

      const orderPayload = {
        client_name,
        client_phone,
        car_model,
        issue,
        address,
        lat: clientLat,
        lng: clientLng,
        time: new Date().toLocaleTimeString()
      };

      // Wysłanie zlecenia prosto do kokpitu kierowcy
      client.publish('pomoc-drogowa/nowe-zlecenie', JSON.stringify(orderPayload));

      document.getElementById('requestFormCard').classList.add('hidden');
      document.getElementById('statusTrackerCard').classList.remove('hidden');
      document.getElementById('clientStatusBadge').innerText = "Wysłano zgłoszenie do kierowcy!";
    }
  </script>
</body>
</html>
