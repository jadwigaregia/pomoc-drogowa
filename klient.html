<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gdzie jest pomoc? - Śledzenie na żywo</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    #map { width: 100vw; height: 100vh; z-index: 1; }
    .overlay {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9); color: #fff; padding: 12px 24px;
      border-radius: 30px; font-weight: 600; font-size: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 1000;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; gap: 8px;
    }
    .pulse { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="pulse"></div>
    <span id="statusBox">Szukanie aktywnych lawet...</span>
  </div>

  <div id="map"></div>

  <script>
    const SUPABASE_URL = "https://pofvghphcfrdtalyqui.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5ftuKj2b17oQkeyqDpsePg_k13hgzhn";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const map = L.map('map').setView([52.40637, 16.92516], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let markers = {};

    // Pobranie pozycji klienta
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          map.setView([lat, lng], 13);
          L.marker([lat, lng])
            .addTo(map)
            .bindPopup("<b>📍 Twoja lokalizacja</b><br>Miejsce wezwania pomocy")
            .openPopup();
        },
        () => console.log("Brak zgody na pozycję klienta"),
        { enableHighAccuracy: true }
      );
    }

    const channel = supabaseClient.channel('tracking-room');

    // Nasłuchiwanie stanu wszystkich aktywnych pojazdów na bieżąco
    channel
      .on('presence', { event: 'sync' }, () => {
        const state = channel.presenceState();
        const driverKeys = Object.keys(state);

        if (driverKeys.length === 0) {
          document.getElementById("statusBox").innerText = "Oczekiwanie na aktywne lawety...";
          return;
        }

        document.getElementById("statusBox").innerText = `Dostępne lawety na żywo: ${driverKeys.length}`;

        driverKeys.forEach((key) => {
          const driverInfo = state[key][0];
          if (!driverInfo || !driverInfo.lat || !driverInfo.lng) return;

          if (markers[key]) {
            markers[key].setLatLng([driverInfo.lat, driverInfo.lng]);
          } else {
            const m = L.marker([driverInfo.lat, driverInfo.lng]).addTo(map);
            m.bindPopup(`<b>🚗 ${driverInfo.name || 'Laweta'}</b><br>Aktywna na żywo`).openPopup();
            markers[key] = m;
          }
        });
      })
      .on('presence', { event: 'leave' }, ({ key }) => {
        if (markers[key]) {
          map.removeLayer(markers[key]);
          delete markers[key];
        }
      })
      .subscribe();
  </script>
</body>
</html>
